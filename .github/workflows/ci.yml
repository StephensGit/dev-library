name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only access to the repo is all this workflow needs.
permissions:
  contents: read

# Cancel an in-progress run when a newer commit is pushed to the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # A throwaway Postgres for the API integration tests, matching docker-compose.yml.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dev_library_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # No `version` input: reads devEngines.packageManager from package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format, lint and typecheck
        run: pnpm check

      # Applies every migration to the test database, then runs the auth and ownership tests.
      - name: Test API
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dev_library_test

      - name: Build web
        run: pnpm --filter web build

      - name: Build CLI
        run: pnpm --filter cli build

      - name: Smoke-test CLI
        run: node apps/cli/dist/index.js --help
